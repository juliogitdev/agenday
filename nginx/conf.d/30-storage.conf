# ============================================================
# storage.agenday.com → MinIO (:9000)
# ============================================================
# Este domínio é usado pelo Spring Boot ao gerar signed URLs.
# MINIO_SERVER_URL deve apontar para este domínio para que as
# URLs pré-assinadas sejam resolvíveis pelo cliente.
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name storage.agenday.com;

    ssl_certificate     /etc/letsencrypt/live/agenday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenday.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Limite de upload
    client_max_body_size 50M;

    # Ignora host header interno para evitar redirect loop do MinIO
    proxy_set_header Host $http_host;

    location / {
        proxy_pass              http://minio:9000;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Necessário para upload multipart do MinIO
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";

        # Timeouts para uploads grandes
        proxy_connect_timeout   60s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
    }
}
