# ============================================================
# api.agenday.com → Backend (Spring Boot :8080)
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.agenday.com;

    ssl_certificate     /etc/letsencrypt/live/agenday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenday.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Limite de payload para uploads
    client_max_body_size 50M;

    location / {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts para chamadas longas (uploads, relatórios)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Actuator: restringir acesso externo
    location /actuator {
        deny all;
    }
}
