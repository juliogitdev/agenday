services:
  db:
    image: postgres:15-alpine
    container_name: agenday-db
    restart: always
    environment:
      POSTGRES_DB: agenday
      POSTGRES_USER: ${DB_USER:?DB_USER não definido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definido}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agenday-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./agenday-backend
    env_file:
      - .env
    container_name: agenday-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/agenday
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET não definido}
  
  frontend:
    build: ./agenday-frontend
    env_file:
      - ./agenday-frontend/.env.local
    container_name: agenday-web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
      
volumes:
  postgres_data: