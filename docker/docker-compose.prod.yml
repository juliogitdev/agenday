services:

  db:
    image: postgres:16-alpine
    container_name: agenday-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - agenday_db_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Sem exposição de porta — inacessível fora da rede interna

  redis:
    image: redis:7-alpine
    container_name: agenday-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - agenday_redis_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Sem exposição de porta — inacessível fora da rede interna

  minio:
    image: minio/minio:latest
    container_name: agenday-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # Necessário para signed URLs apontarem para o domínio público
      MINIO_BROWSER_REDIRECT_URL: https://storage.agenday.com
      MINIO_SERVER_URL: https://storage.agenday.com
    volumes:
      - agenday_minio_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Sem exposição direta — acesso via Nginx em storage.agenday.com

  minio-init:
    image: minio/mc:latest
    container_name: agenday-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
        mc alias set prod http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing prod/agenday-images &&
        mc mb --ignore-existing prod/agenday-files &&
        mc anonymous set download prod/agenday-images &&
        echo 'MinIO buckets initialized.'
      "

  backend:
    image: agenday/backend:${APP_VERSION:-latest}
    container_name: agenday-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - /var/log/agenday:/var/log/agenday
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: agenday/frontend:${APP_VERSION:-latest}
    container_name: agenday-frontend
    restart: always
    networks:
      - internal
    # Apenas Nginx acessa; sem porta exposta diretamente

  nginx:
    image: nginx:1.27-alpine
    container_name: agenday-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  agenday_db_prod:
  agenday_redis_prod:
  agenday_minio_prod:

networks:
  internal:
    name: agenday-prod-network
    driver: bridge
