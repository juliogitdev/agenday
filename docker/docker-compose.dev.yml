services:

  db:
    image: postgres:16-alpine
    container_name: agenday-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenday_dev
      POSTGRES_USER: agenday
      POSTGRES_PASSWORD: agenday_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - agenday_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenday -d agenday_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agenday-redis-dev
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - agenday_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: agenday-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agenday_minio_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: agenday-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/agenday-images &&
        mc mb --ignore-existing local/agenday-files &&
        mc anonymous set download local/agenday-images &&
        echo 'MinIO buckets initialized.'
      "

volumes:
  agenday_db_dev:
  agenday_redis_dev:
  agenday_minio_dev:

networks:
  default:
    name: agenday-dev-network
