spring:
  datasource:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    url: jdbc:postgresql://db:5432/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket:
    images: agenday-images
    files: agenday-files
  # URL pública usada para gerar signed URLs acessíveis pelo cliente
  public-base-url: https://storage.agenday.com

logging:
  level:
    root: WARN
    com.agenday: INFO
  file:
    name: /var/log/agenday/app.log
    max-size: 100MB
    max-history: 30

server:
  port: 8080
  forward-headers-strategy: framework

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins:
      - https://agenday.com
      - https://www.agenday.com
